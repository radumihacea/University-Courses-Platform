spring.application.name=course-platform
server.port=8080

# --- Conexiunea la MySQL ---
# Baza de date "course_platform" se creeaza automat la prima pornire.
spring.datasource.url=jdbc:mysql://localhost:3306/course_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Bucharest
spring.datasource.username=root
# Parola NU se scrie aici: se citeste din application-local.properties (ignorat de Git)
spring.config.import=optional:classpath:application-local.properties

# --- JPA / Hibernate ---
# "update" creeaza si actualizeaza tabelele automat pe baza entitatilor
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
